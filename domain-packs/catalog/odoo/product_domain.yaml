# Médias détectés dans le schéma réel (jamais supposés) : en Odoo les champs Image ont le type
# natif « binary » ; seule la convention de nom permet de les reconnaître.
media:
  detect:
    native_types: [image]
    name_patterns: ['^image_\d+$', '^image_variant_\d+$']
  # sur une entité non variante : la plus haute résolution (suffixe numérique) = main,
  # les autres tailles = derivative (pas des images métier distinctes)
  main: highest_resolution
  # tous les champs médias des entités de ces rôles = images de variante
  variant_level_roles: [VARIANT]

field_defaults:
  listed_field_relevance: RELEVANT
  unlisted_standard_field_relevance: POSSIBLE
  unlisted_field_group: other
  technical_fields_group: technical
  technical_fields_relevance: NOT_RELEVANT

# --------------------------------------------------------------------------------------------------
# Semantic Enrichment (V1b) : règles de pertinence DÉTERMINISTES, évaluées dans l'ordre sur chaque champ
# présent du domaine effectif ; la première qui correspond gagne et son id est tracé. Les conditions
# d'une règle sont combinées par ET (any_of : OU). Raison affichée au supplier (anglais), variables :
# {field} {entity} {target} {modules} {key}. Une exclusion (NOT_RELEVANT) reste contestable (include).
semantics:
  known_threshold: 0.90
  # contrôles de structure de la page « Product Catalog Analysis » (MEDIA : au moins un champ image)
  structure_checks: [PRIMARY, VARIANT, CATEGORY, ATTRIBUTE, MEDIA]
  rules:
    - id: R01
      description: technical fields (id, create_*, write_*, __last_update)
      when:
        any_of:
          - {technical: true}
          - {name_patterns: ['^id$', '^create_(uid|date)$', '^write_(uid|date)$', '^__last_update$']}
      relevance: NOT_RELEVANT
      reason: Technical field managed by the system
    - id: R02
      description: field explicitly listed in the pack with a business group
      when: {listed: true, group_not_in: [other]}
      relevance: RELEVANT
      reason: Catalog field declared by the domain pack
    - id: R03
      description: media field detected by the media rule
      when: {is_media: true}
      relevance: RELEVANT
      reason: Product image
    - id: R04
      description: relation to an entity outside the domain scope (no role)
      when: {relation_outside_scope: true}
      relevance: NOT_RELEVANT
      reason: Link to {target}, which is not part of the product catalog
    - id: R05
      description: field added only by non-catalog modules
      when:
        modules_all_in: [sale_project, sale_project_stock, sale_service, sale_timesheet, project,
                         project_account, project_purchase, project_sms, project_todo, rating, portal_rating,
                         hr, hr_org_chart, hr_skills, hr_timesheet, mail_bot_hr, mail, portal, website,
                         web_hierarchy]
      relevance: NOT_RELEVANT
      reason: Added by module {modules}, which is not part of the product catalog
    - id: R06
      description: computed, non-stored helper (counters, has_*, display_name, html, activities, messages)
      when:
        computed: true
        stored: false
        name_patterns: ['_count$', '^has_', '^display_name$', '_html$', '(^|_)activity_', '^message_']
      relevance: NOT_RELEVANT
      reason: Computed helper, not product data
    - id: R07
      description: user-interface flag (show_*, *_visible, hide_*...)
      when:
        native_types: [selection, boolean]
        name_patterns: ['^show_', '_visible$', '^hide_', '_invisible$', '^can_image_(variant_)?\d+_be_zoomed$']
      relevance: NOT_RELEVANT
      reason: User-interface flag, not product data
    # ---------------------------------------------------------------- V1b.1
    # R18 avant R08 : une copie related standard suit la décision FINALE de son champ d'origine (même
    # donnée, une seule décision ; jamais une exclusion indépendante d'une copie d'un champ du catalogue).
    # R11-R17 après R08 : un champ qui correspond au vocabulaire reste RELEVANT, les exclusions ne jouent
    # que sur les champs sans correspondance sûre. Aucune règle ne touche un champ protégé
    # (protected_fields.yaml) ni un champ listé (R02 passe avant).
    - id: R18
      description: standard related copy of a field of another domain entity (follows its decision)
      when: {origins: [STANDARD], related_copy: true}
      follow_source: true
      reason: Reflects {source}
    - id: R08
      description: alias or pattern of the vocabulary with a compatible type
      when: {min_match_confidence: 0.90}
      relevance: RELEVANT
      reason: Matches the catalog vocabulary ({key})
    - id: R11
      description: technical back-reference (collection whose relation is carried by the target entity)
      when: {back_reference: true}
      relevance: NOT_RELEVANT
      reason: Technical back-reference to {target}; the relation is carried by {inverse}
    - id: R12
      description: operational quantity or counter (stock, sales, purchases)
      when:
        data_types: [decimal, integer]
        any_of:
          # un jeton qty / quantity ET un jeton de mouvement ou de disponibilité (min_qty n'en a pas)
          - name_patterns: ['^(?=.*(?:^|_)(?:qty|quantity)(?:_|$))(?=.*(?:^|_)(?:available|virtual|incoming|outgoing|forecast|free|reserved|purchased|sold|delivered|received)(?:_|$))']
          - name_patterns: ['_available$', '^nbr_', '_count$']
          - {computed: true, stored: false, name_patterns: ['^number_']}
      relevance: NOT_RELEVANT
      reason: Operational quantity or counter (stock, sales, purchases), not catalog data
    - id: R15
      description: internal ORM mechanics or user-interface helper
      when:
        any_of:
          - name_patterns: ['^parent_path$', '^sequence$', '^priority$', '^is_product_variant$', '^has_configurable_',
                            '^valid_', '_tooltip$', '^tax_string$', '^fiscal_country_codes$', '_definition$',
                            '^display_type$', '_indices$']
          - native_types: [properties_definition]
      relevance: NOT_RELEVANT
      reason: Internal Odoo mechanics or user-interface helper, not catalog data
    - id: R16
      description: accounting valuation settings (valuation, costing method, stock valuation layers)
      when:
        name_patterns: ['(^|_)valuation$', '(^|_)cost_method$', '^property_account_', '_svl$', '^avg_cost$',
                        '^total_value$']
      relevance: NOT_RELEVANT
      reason: Accounting valuation setting, not catalog data
    - id: R17
      description: operational default of a category (properties, putaway, reservation, removal)
      when:
        entity_roles: [CATEGORY]
        name_patterns: ['^property_', '_putaway', '_reserve_', '(^|_)removal_']
      relevance: NOT_RELEVANT
      reason: Operational default of the category, not catalog data
    - id: R13
      description: logistics, replenishment or operations parameter
      when:
        any_of:
          - name_patterns: ['^reordering_', '^(sale|produce)_delay$', '^description_picking', '^route_ids$',
                            '^responsible_id$', '^property_stock_', 'putaway', '_reserve_method$']
          # modules d'opérations (liste explicite : pas de joker mrp_* / quality*)
          - modules_all_in: [stock, stock_account, purchase_stock, sale_stock, mrp, mrp_account, quality,
                             quality_control, repair, maintenance]
      relevance: NOT_RELEVANT
      reason: Logistics, replenishment or operations parameter, not catalog data
    - id: R14
      description: sales, purchase or invoicing policy or warning
      when:
        any_of:
          - name_patterns: ['_policy$', '(?<!cost)_method$', '_warn(_msg)?$', '^invoice_', '^expense_', '^visible_',
                            '^service_']
          - modules_all_in: [sale_management, purchase, account, sale_expense, sale_service, sale_purchase]
      relevance: NOT_RELEVANT
      reason: Sales, purchase or invoicing policy, not catalog data
    - id: R09
      description: custom field without vocabulary match (asked to the supplier)
      when: {origins: [CUSTOM], no_match: true}
      relevance: POSSIBLE
      reason: Custom field without a known meaning
    - id: R10
      description: default
      relevance: POSSIBLE
      reason: Standard field not declared by the domain pack

# Traduction des valeurs de la source en valeurs canoniques (Product CDM : ProductKind), donnée du pack, jamais
# du Core. Hors de la définition résolue et du checksum des règles : aucune analyse ne change. Valeur absente
# de la table (kit, combo, module tiers…) = sorte inconnue, jamais devinée. Odoo 17 seulement : en 18 / 19 la
# sorte est le champ « type », non déclaré avec la clé product_type dans ce pack.
value_maps:
  - entity: product.template
    field: detailed_type
    key: product_type
    values: {consu: GOODS, product: GOODS, service: SERVICE}

# Noms des unités de mesure d'une installation STANDARD d'Odoo (uom), par code canonique du Wizard
# (uie_core.wizard.units) : les valeurs d'unités d'un fichier (« Stück », « St. », « Meter »…) sont écrites avec
# ces noms. Unités d'emballage (Set, Packung…) : jamais traduites seules (décision de l'utilisateur).
unit_names:
  unit: Units
  dozen: Dozens
  kg: kg
  g: g
  t: t
  lb: lb
  oz: oz
  m: m
  cm: cm
  mm: mm
  km: km
  in: in
  ft: ft
  l: L
  m2: m²
  m3: m³
  h: Hours
  day: Days

# Unité, dans une installation standard d'Odoo, des champs chiffrés de product.template (réglages par défaut de
# la société : kilogrammes, mètres cubes) : une valeur d'une autre unité de même nature est convertie.
field_units:
  weight: kg
  volume: m3

# Import de fichier d'Odoo (base_import) sur product.template : valeur écrite par Odoo quand la colonne est
# ABSENTE (valeur par défaut du champ) et quand la cellule est VIDE. Mesuré le 2026-10-23 : Odoo 17
# (accounting17, import réel dans une copie) et Odoo 18 (ref18, default_get) ; Odoo 19 non mesuré. Le Wizard le
# DIT à l'utilisateur, il n'écrit jamais ces valeurs lui-même.
import_defaults:
  list_price: {absent: "1.00", empty: "0.00"}
  standard_price: {absent: "0.00", empty: "0.00"}
