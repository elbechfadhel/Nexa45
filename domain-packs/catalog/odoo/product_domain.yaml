# Définition standard du domaine PRODUCT pour Odoo (Product Domain V1a).
#
# Ce fichier DÉCLARE ; le service RÉSOUT contre un snapshot (standard, puis instance).
# Règle de version : une entité ou un champ déclaré mais absent du snapshot est marqué
# present=false, jamais une erreur. On déclare donc l'union des versions 17 / 18 / 19
# (ex. detailed_type n'existe qu'en 17, uom_ids qu'en 19).
#
# Champs d'une entité du scope NON listés ici :
#   - champ image détecté par la règle media → group media ;
#   - champ technique (metadata.technical du Registry) → group technical, NOT_RELEVANT ;
#   - sinon → group other, relevance POSSIBLE (field_defaults).
# Toute modification du contenu (ou du vocabulaire) impose d'incrémenter definition_version (une
# définition persistée est immutable ; même version + contenu différent = refus).
#
# « key » (V1b) : semantic_key du vocabulaire (catalog/vocabulary.yaml) déclarée pour ce champ ;
# elle prime sur les alias génériques (confiance 0.98). Absente : le moteur cherche seul.

domain: PRODUCT
system: odoo
definition_version: "1.9.0"  # 1.9.0 : import_defaults (prix sans valeur à l'import de fichier)
versions: ["17", "18", "19"]

entities:
  - {technical_name: product.template, role: PRIMARY}
  - {technical_name: product.product, role: VARIANT}
  - {technical_name: product.category, role: CATEGORY}
  - {technical_name: product.attribute, role: ATTRIBUTE}
  - {technical_name: product.attribute.value, role: ATTRIBUTE_VALUE}
  - {technical_name: product.template.attribute.line, role: ATTRIBUTE_LINE}
  - {technical_name: product.template.attribute.value, role: VARIANT_VALUE}
  - {technical_name: uom.uom, role: UOM}
  - {technical_name: product.supplierinfo, role: SUPPLIER_INFO}

