  - {entity: product.template, field: supplier_taxes_id, group: commercial, key: purchase_taxes}
  - {entity: product.template, field: description, group: description, key: description_internal}
  - {entity: product.template, field: description_sale, group: description, key: description_sale}
  - {entity: product.template, field: description_purchase, group: description, key: description_purchase}
  - {entity: product.template, field: categ_id, group: classification, key: category}
  - {entity: product.template, field: type, group: classification}
  - {entity: product.template, field: detailed_type, group: classification, key: product_type}
  - {entity: product.template, field: is_storable, group: classification}
  - {entity: product.template, field: product_tag_ids, group: classification, key: tags}
  - {entity: product.template, field: uom_id, group: logistics, key: uom}
  - {entity: product.template, field: uom_po_id, group: logistics, key: uom_purchase}
  - {entity: product.template, field: uom_ids, group: logistics}
  - {entity: product.template, field: weight, group: logistics, key: weight}
  - {entity: product.template, field: volume, group: logistics, key: volume}
  - {entity: product.template, field: weight_uom_name, group: logistics}
  - {entity: product.template, field: volume_uom_name, group: logistics}
  - {entity: product.template, field: packaging_ids, group: logistics, key: packaging}
