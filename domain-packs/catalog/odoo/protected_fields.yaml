# Champs protégés du domaine PRODUCT pour Odoo (Product Domain V1b.1) : LISTE DE SÛRETÉ, pas une règle.
#
# Ces champs sont du catalogue par nature : aucune règle ne peut les rendre NOT_RELEVANT (une règle
# d'exclusion qui leur correspond est sautée, la suivante décide). Seul un humain peut les ignorer.
# Une règle peut les laisser POSSIBLE (ex. color, code : leur sens reste à établir, cas pour V1c).
# On déclare l'union des versions 17 / 18 / 19 : un champ absent du snapshot est simplement ignoré.
# Ce fichier entre dans le checksum des règles : toute modification impose d'incrémenter
# definition_version dans product_domain.yaml.

domain: PRODUCT
system: odoo

# toute extension custom (x_*) est posée ou proposée, jamais exclue par une règle
origins: [CUSTOM]
# tout champ média détecté par la règle media du pack
media: true

fields:
  product.template: [name, default_code, barcode, active, list_price, standard_price, sale_ok, purchase_ok,
                     description, description_sale, description_purchase, categ_id, type, product_tag_ids,
                     uom_id, uom_po_id, weight, volume, image_1920, attribute_line_ids, seller_ids,
                     product_variant_ids, taxes_id, supplier_taxes_id, currency_id, company_id, tracking,
                     packaging_ids, color]
  product.product: [default_code, barcode, active, lst_price, standard_price, product_tmpl_id,
                    product_template_attribute_value_ids, combination_indices, image_variant_1920, image_1920,
                    weight, volume, code]
  product.category: [name, complete_name, parent_id, child_id]
  product.attribute: [name, display_type, create_variant, value_ids, sequence]
  product.attribute.value: [name, attribute_id, sequence, html_color, is_custom, color]
  product.template.attribute.line: [attribute_id, value_ids, product_tmpl_id]
  product.template.attribute.value: [name, product_attribute_value_id, attribute_line_id, price_extra, ptav_active]
  uom.uom: [name, category_id, factor, rounding, uom_type]
  product.supplierinfo: [partner_id, product_name, product_code, price, min_qty, delay, currency_id,
                         product_tmpl_id, product_id, date_start, date_end]
