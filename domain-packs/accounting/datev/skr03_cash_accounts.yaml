# Comptes d'usage en SKR03 d'un LIVRE DE CAISSE (Kassenbuch) pour DATEV Buchungsstapel : compte de la caisse,
# compte de transit (Geldtransit) et contre-compte de chaque catégorie de caisse, par taux de TVA.
# USAGE COURANT, À VALIDER PAR LE STEUERBERATER : cette table ne sert qu'à PRÉSÉLECTIONNER (compte de caisse du
# dossier, compte d'une catégorie), changeable dans « Decided for you » ; une catégorie absente, ou sans compte
# ici, n'est jamais devinée (question). Pas un domain pack (`kind: cash_accounts`). Toute modification :
# incrémenter table_version.
#
# 8400 / 8300 (Erlöse 19 % / 7 %) : comptes automatiques, aucune clé de taxe. 4930 (Bürobedarf) reçoit la clé
# de Vorsteuer du taux ; 4910 (Porto) : 0 %, aucune clé. 1360 (Geldtransit) : dépôt à la banque et retrait,
# sans TVA. Bewirtung : absente (question). Privatentnahme : sans TVA, compte selon la forme juridique du
# mandant (question, jamais présélectionnée).

kind: cash_accounts
table_version: "1.1.0"   # 1.1.0 : note de la Privatentnahme
target: {system: datev, product: buchungsstapel}
chart: "03"
status: usual practice, to be validated by your tax advisor (Steuerberater)

cash_account: "1000"       # Kasse : compte de la caisse du dossier (réglage présélectionné)
transit_account: "1360"    # Geldtransit

automatic_accounts: ["8400", "8300"]
# clé de Vorsteuer d'usage par taux pour une DÉPENSE de caisse (sur 4 chiffres, Buchungsstapel 13) ; 0 % : aucune
tax_keys: {"19": "0009", "7": "0008"}

categories:
  - {names: [Barverkauf, Barverkäufe, Tageslosung, Tageseinnahme, Ladenverkauf], rate: 19, account: "8400"}
  - {names: [Barverkauf, Barverkäufe, Tageslosung, Tageseinnahme, Ladenverkauf], rate: 7, account: "8300"}
  - {names: [Bürobedarf, Büromaterial, Büroartikel], rate: 19, account: "4930"}
  - {names: [Porto, Briefmarken, Postgebühren], rate: 0, account: "4910"}
  - {names: [Bankeinzahlung, Einzahlung Bank, Geldtransit], no_vat: true, account: "1360"}
  - {names: [Bankabhebung, Abhebung Bank, Bankauszahlung], no_vat: true, account: "1360"}
  # sans TVA, mais compte jamais présélectionné : il dépend de la forme juridique du mandant
  - {names: [Privatentnahme, Privateinlage], no_vat: true,
     note: "Its account depends on the legal form of the client (sole trader, partnership or company): it is never
       preselected, ask your tax advisor."}
