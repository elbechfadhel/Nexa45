# Comptes de CHARGE d'usage en SKR03 par catégorie de charge (« Kostenart ») d'un journal de factures d'achat,
# pour DATEV Buchungsstapel. USAGE COURANT, À VALIDER PAR LE STEUERBERATER : cette table ne sert qu'à
# PRÉSÉLECTIONNER la réponse à l'unique question « catégorie → compte » ; une catégorie absente n'est jamais
# devinée (la question reste sans réponse). Pas un domain pack (`kind: category_accounts`).
# Toute modification : incrémenter table_version.
#
# 3400 / 3300 (Wareneingang 19 % / 7 % Vorsteuer) sont des comptes automatiques (la TVA déductible est
# calculée par DATEV) ; 4210 (Miete) : loyer sans TVA ; les autres comptes reçoivent la clé de Vorsteuer.

kind: category_accounts
table_version: "1.0.0"
target: {system: datev, product: buchungsstapel}
chart: "03"
scope: PURCHASE
status: usual practice, to be confirmed by your tax advisor

