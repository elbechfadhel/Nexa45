  - {names: [Wareneinkauf, Wareneingang, Waren, Handelswaren], rate: 7, account: "3300"}
  - {names: [Bürobedarf, Büromaterial, Büroartikel], rate: 19, account: "4930"}
  - {names: [Telefon/Internet, Telefon, Internet, Telekommunikation], rate: 19, account: "4920"}
  - {names: [Kfz-Kraftstoff, Kraftstoff, Treibstoff, Tankrechnung], rate: 19, account: "4530"}
