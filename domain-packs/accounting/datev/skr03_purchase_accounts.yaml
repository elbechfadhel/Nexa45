# Comptes de CHARGE d'usage en SKR03 par catégorie de charge (« Kostenart ») d'un journal de factures d'achat,
# pour DATEV Buchungsstapel. USAGE COURANT, À VALIDER PAR LE STEUERBERATER : cette table ne sert qu'à
# PRÉSÉLECTIONNER la réponse à l'unique question « catégorie → compte » ; une catégorie absente n'est jamais
# devinée (la question reste sans réponse). Pas un domain pack (`kind: category_accounts`).
# Toute modification : incrémenter table_version.
#
# 3400 / 3300 (Wareneingang 19 % / 7 % Vorsteuer) sont des comptes automatiques (la TVA déductible est
# calculée par DATEV) ; 4210 (Miete) : loyer sans TVA ; les autres comptes reçoivent la clé de Vorsteuer.

kind: category_accounts
table_version: "1.2.0"   # 1.1.0 : comptes automatiques et clés de Vorsteuer ; 1.2.0 : clés à 4 chiffres
target: {system: datev, product: buchungsstapel}
chart: "03"
scope: PURCHASE
status: usual practice, to be confirmed by your tax advisor

# comptes automatiques : DATEV calcule la TVA déductible, aucune clé de taxe (BU-Schlüssel)
automatic_accounts: ["3300", "3400"]
# clé de Vorsteuer d'usage par taux pour les autres comptes (9 : 19 %, 8 : 7 %), écrite sur 4 chiffres comme
# l'exige le format Buchungsstapel 13 (BU-Schlüssel, motif du Registry) ; 0 % : aucune clé
tax_keys: {"19": "0009", "7": "0008"}

categories:
  - {names: [Wareneinkauf, Wareneingang, Waren, Handelswaren], rate: 19, account: "3400"}
  - {names: [Wareneinkauf, Wareneingang, Waren, Handelswaren], rate: 7, account: "3300"}
  - {names: [Bürobedarf, Büromaterial, Büroartikel], rate: 19, account: "4930"}
  - {names: [Telefon/Internet, Telefon, Internet, Telekommunikation], rate: 19, account: "4920"}
  - {names: [Kfz-Kraftstoff, Kraftstoff, Treibstoff, Tankrechnung], rate: 19, account: "4530"}
  - {names: [Werbung, Werbekosten], rate: 19, account: "4600"}
  - {names: [Miete, Raummiete, Mietaufwand], rate: 0, account: "4210"}
