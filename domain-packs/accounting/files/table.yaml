# Tableau de source FICHIER du domaine ACCOUNTING : colonnes d'un journal de factures de sortie (Rechnungs-
# ausgangsbuch, export d'un logiciel de facturation) ou de factures d'ACHAT (Rechnungseingangsbuch) et ce
# qu'elles veulent dire. Une ligne = une facture (ou un avoir) à UN taux de TVA. Aucun système ici ; HORS des
# vocabulaires des systèmes (aucune analyse ne change). Toute modification : incrémenter table_version.
#
# Montants : « Netto », « USt », « Brutto » ; le brut fait foi pour l'écriture (un brut négatif = un avoir),
# le net et la TVA servent au CONTRÔLE (net + TVA = brut, à 0,01 près ; jamais corrigé).
# Taux de TVA admis : ceux du pays à la date de la facture (16 % / 5 % : taux temporaires de 2020, plus admis).

table_version: "1.3.0"   # 1.1.0 : factures d'achat ; 1.2.0 : leurs colonnes ; 1.3.0 : Leistungsart
domain: ACCOUNTING
data_types: ["Invoices", "Purchase invoices"]
home_country: DE

columns:
  - key: document_number
    label: Invoice number
    description: Number of the invoice or credit note (Belegfeld 1).
    required: true
    aliases: [re nr, rechnungsnr, rechnungsnummer, rechnung nr, beleg nr, belegnr, belegnummer, belegfeld 1,
              invoice no, invoice number, invoice, document number, numéro de facture,
              beleg nr lieferant, rechnungsnr lieferant, rechnungsnummer lieferant, fremdbeleg, fremdbelegnummer,
              supplier invoice number, vendor invoice number, numéro de facture fournisseur]
  - key: document_date
    label: Invoice date
    data_type: date
    group: dates
    required: true
    aliases: [re datum, rechnungsdatum, belegdatum, datum, invoice date, document date, date, date de facture]
  # numéro du client (ventes) OU du fournisseur (achats) : l'un des deux est exigé selon le type du fichier
  - key: partner_number
    label: Customer number
    description: Number of the customer in the source; the same number as in the customer list.
    aliases: [kd nr, kdnr, kunden nr, kundennr, kundennummer, debitor, debitor nr, debitorennummer,
              customer no, customer number, numéro client]
  - key: supplier_number
    label: Supplier number
    description: Number of the supplier in the source; the same number as in the supplier list.
    aliases: [lief nr, liefnr, lieferanten nr, lieferantennr, lieferantennummer, kreditor, kreditor nr,
              kreditorennummer, supplier no, supplier number, vendor no, vendor number, numéro fournisseur]
  - key: partner_name
    label: Customer or supplier name
    description: Name of the customer or of the supplier as written on the invoice (booking text).
    aliases: [kunde, kundenname, name, firma, empfänger, customer, customer name, client,
              lieferant, lieferantenname, supplier, supplier name, vendor, vendor name, fournisseur]
  - key: expense_category
    label: Expense category
    description: Kind of expense of a purchase invoice (Kostenart); its account is confirmed once, never
      guessed.
    aliases: [kostenart, aufwandsart, aufwand, ausgabenart, kostenkategorie, buchungskategorie, kategorie,
              expense category, expense type, category, nature de charge, catégorie]
  # nature de l'opération : la TVA d'une vente ou d'un achat avec l'étranger en dépend ; vide ou autre
  # valeur → jamais devinée (ni depuis la catégorie, ni depuis une remarque)
  - key: supply_kind
    label: Kind of supply
    description: Goods or services (Leistungsart); the VAT of a cross-border invoice depends on it.
    aliases: [leistungsart, art der leistung, umsatzart, lieferart, ware dienstleistung, kind of supply,
              type of supply, supply type, goods or services, nature de l opération, type d opération]
    values:
      GOODS: [ware, waren, warenlieferung, lieferung, goods, good, delivery of goods, marchandise,
              marchandises, livraison, livraison de biens]
      SERVICES: [dienstleistung, dienstleistungen, sonstige leistung, leistung, service, services,
                 prestation, prestations, prestation de service, prestation de services]
  - key: net_amount
    label: Net amount
    data_type: decimal
    group: amounts
    aliases: [netto, netto €, nettobetrag, netto eur, net, net amount, montant ht, ht]
  - key: tax_rate
    label: VAT rate
    data_type: decimal
    group: tax
    aliases: [ust %, mwst %, ust satz, mwst satz, steuersatz, umsatzsteuersatz, vat %, vat rate, tax rate,
              taux de tva, tva %]
  - key: tax_amount
    label: VAT amount
    data_type: decimal
    group: amounts
    aliases: [ust €, mwst €, ust betrag, mwst betrag, umsatzsteuer, vat amount, tax amount, montant tva]
  - key: gross_amount
    label: Gross amount
    data_type: decimal
    group: amounts
    required: true
    aliases: [brutto, brutto €, bruttobetrag, brutto eur, rechnungsbetrag, gesamtbetrag, gross, gross amount,
              total, montant ttc, ttc]
  - key: currency
    label: Currency
    aliases: [währung, waehrung, wkz, currency, devise]
  # texte libre de la source : reconnu (jamais envoyé à l'IA), jamais exporté ni lu pour décider quoi que ce
  # soit (une exonération ne se déduit jamais d'un commentaire)
  - key: remark
    label: Remark
    description: Free text of the source; never exported, never used to decide anything.
    aliases: [bemerkung, bemerkungen, notiz, kommentar, anmerkung, hinweis, remark, remarks, note, notes,
              comment, comments, remarque]

tax_rates:
  - {country: DE, since: 2021-01-01, rates: [19, 7, 0]}
