# Tableau de source FICHIER du domaine ACCOUNTING : colonnes d'un journal de factures de sortie (Rechnungs-
# ausgangsbuch, export d'un logiciel de facturation) ou de factures d'ACHAT (Rechnungseingangsbuch) et ce
# qu'elles veulent dire. Une ligne = une facture (ou un avoir) à UN taux de TVA. Aucun système ici ; HORS des
# vocabulaires des systèmes (aucune analyse ne change). Toute modification : incrémenter table_version.
#
# Montants : « Netto », « USt », « Brutto » ; le brut fait foi pour l'écriture (un brut négatif = un avoir),
# le net et la TVA servent au CONTRÔLE (net + TVA = brut, à 0,01 près ; jamais corrigé).
# Taux de TVA admis : ceux du pays à la date de la facture (16 % / 5 % : taux temporaires de 2020, plus admis).

table_version: "1.5.0"   # 1.1.0 : factures d'achat ; 1.2.0 : leurs colonnes ; 1.3.0 : Leistungsart ;
                         # 1.4.0 : livre de caisse ; 1.5.0 : relevé bancaire
domain: ACCOUNTING
data_types: ["Invoices", "Purchase invoices", "Cash book", "Bank statement"]
home_country: DE

columns:
  - key: document_number
    label: Invoice number
    description: Number of the invoice or credit note (Belegfeld 1).
    required: true
    aliases: [re nr, rechnungsnr, rechnungsnummer, rechnung nr, beleg nr, belegnr, belegnummer, belegfeld 1,
              invoice no, invoice number, invoice, document number, numéro de facture,
              beleg nr lieferant, rechnungsnr lieferant, rechnungsnummer lieferant, fremdbeleg, fremdbelegnummer,
              supplier invoice number, vendor invoice number, numéro de facture fournisseur]
  - key: document_date
    label: Invoice date
    data_type: date
    group: dates
    required: true
    aliases: [re datum, rechnungsdatum, belegdatum, datum, invoice date, document date, date, date de facture,
              buchungstag, buchungsdatum, booking date]
  # numéro du client (ventes) OU du fournisseur (achats) : l'un des deux est exigé selon le type du fichier
  - key: partner_number
    data_types: [Invoices, Purchase invoices]
    label: Customer number
    description: Number of the customer in the source; the same number as in the customer list.
    aliases: [kd nr, kdnr, kunden nr, kundennr, kundennummer, debitor, debitor nr, debitorennummer,
              customer no, customer number, numéro client]
  - key: supplier_number
    data_types: [Invoices, Purchase invoices]
    label: Supplier number
    description: Number of the supplier in the source; the same number as in the supplier list.
    aliases: [lief nr, liefnr, lieferanten nr, lieferantennr, lieferantennummer, kreditor, kreditor nr,
              kreditorennummer, supplier no, supplier number, vendor no, vendor number, numéro fournisseur]
  - key: partner_name
    data_types: [Invoices, Purchase invoices]
    label: Customer or supplier name
    description: Name of the customer or of the supplier as written on the invoice (booking text).
    aliases: [kunde, kundenname, name, firma, empfänger, customer, customer name, client,
              lieferant, lieferantenname, supplier, supplier name, vendor, vendor name, fournisseur]
  - key: expense_category
    data_types: [Invoices, Purchase invoices]
    label: Expense category
    description: Kind of expense of a purchase invoice (Kostenart); its account is confirmed once, never
      guessed.
    aliases: [kostenart, aufwandsart, aufwand, ausgabenart, kostenkategorie, buchungskategorie, kategorie,
              expense category, expense type, category, nature de charge, catégorie]
  # nature de l'opération : la TVA d'une vente ou d'un achat avec l'étranger en dépend ; vide ou autre
  # valeur → jamais devinée (ni depuis la catégorie, ni depuis une remarque)
  - key: supply_kind
    data_types: [Invoices, Purchase invoices]
    label: Kind of supply
    description: Goods or services (Leistungsart); the VAT of a cross-border invoice depends on it.
    aliases: [leistungsart, art der leistung, umsatzart, lieferart, ware dienstleistung, kind of supply,
              type of supply, supply type, goods or services, nature de l opération, type d opération]
    values:
      GOODS: [ware, waren, warenlieferung, lieferung, goods, good, delivery of goods, marchandise,
              marchandises, livraison, livraison de biens]
      SERVICES: [dienstleistung, dienstleistungen, sonstige leistung, leistung, service, services,
                 prestation, prestations, prestation de service, prestation de services]
  - key: net_amount
    data_types: [Invoices, Purchase invoices]
    label: Net amount
    data_type: decimal
    group: amounts
    aliases: [netto, netto €, nettobetrag, netto eur, net, net amount, montant ht, ht]
  - key: tax_rate
    label: VAT rate
    data_type: decimal
    group: tax
    aliases: [ust %, mwst %, ust satz, mwst satz, steuersatz, umsatzsteuersatz, vat %, vat rate, tax rate,
              taux de tva, tva %]
  - key: tax_amount
    data_types: [Invoices, Purchase invoices]
    label: VAT amount
    data_type: decimal
    group: amounts
    aliases: [ust €, mwst €, ust betrag, mwst betrag, umsatzsteuer, vat amount, tax amount, montant tva]
  - key: gross_amount
    data_types: [Invoices, Purchase invoices]
    label: Gross amount
    data_type: decimal
    group: amounts
    required: true
    aliases: [brutto, brutto €, bruttobetrag, brutto eur, rechnungsbetrag, gesamtbetrag, gross, gross amount,
              total, montant ttc, ttc]
  - key: currency
    label: Currency
    aliases: [währung, waehrung, wkz, currency, devise]
  # livre de caisse (Kassenbuch) : une ligne = une recette OU une dépense, sans client ni fournisseur ; le solde
  # courant sert au CONTRÔLE (jamais corrigé) ; le texte de la ligne devient le texte de l'écriture
  - key: cash_in
    label: Cash in
    description: Cash received (Einnahme) on this line of the cash book.
    data_type: decimal
    group: amounts
    data_types: [Cash book]
    aliases: [einnahme, einnahmen, einnahme €, einnahmen €, einnahme eur, bareinnahme, bareinnahmen,
              kasseneingang, cash in, cash received, receipts, recette, recettes, encaissement]
  - key: cash_out
    label: Cash out
    description: Cash paid (Ausgabe) on this line of the cash book.
    data_type: decimal
    group: amounts
    data_types: [Cash book]
    aliases: [ausgabe, ausgaben, ausgabe €, ausgaben €, ausgabe eur, barausgabe, barausgaben, kassenausgang,
              cash out, cash paid, payments, dépense, dépenses, décaissement]
  - key: cash_balance
    label: Cash balance
    description: Balance of the cash register after this line (Kassenbestand); checked, never corrected.
    data_type: decimal
    group: amounts
    data_types: [Cash book]
    aliases: [kassenbestand, kassenbestand €, kassenstand, kassensaldo, bestand, saldo, cash balance,
              balance, solde, solde de caisse]
  - key: booking_text
    label: Booking text
    description: Text of the cash book line (Buchungstext); written as the text of the booking.
    data_types: [Cash book]
    aliases: [buchungstext, text, beschreibung, bezeichnung, vorgang, booking text, description, libellé,
              libelle]
  - key: cash_category
    label: Category
    description: Category of the cash book line (Kategorie); its account is confirmed once, never guessed.
    data_types: [Cash book]
    aliases: [kategorie, buchungskategorie, art, kontierung, category, catégorie]
  # relevé bancaire (export « CSV-CAMT » d'une banque, ou relevé CAMT.053 lu sous cette forme) : une ligne = un
  # mouvement du compte, montant SIGNÉ (entrée > 0, sortie < 0) ; le motif de paiement sert au rapprochement avec
  # les factures exportées, jamais le montant seul
  - key: account_iban
    label: Bank account (IBAN)
    description: IBAN of the bank account of this statement (Auftragskonto).
    data_types: [Bank statement]
    aliases: [auftragskonto, kontonummer auftraggeber, eigenes konto, account iban, own account, statement account]
  - key: value_date
    label: Value date
    data_type: date
    group: dates
    data_types: [Bank statement]
    aliases: [valutadatum, valuta, wertstellung, value date, date de valeur]
  - key: bank_text
    label: Transaction type
    description: "Kind of transaction given by the bank (Buchungstext: Gutschrift, Lastschrift…)."
    data_types: [Bank statement]
    aliases: [buchungstext, umsatzart, transaktionsart, transaction type, booking text, type d opération]
  - key: purpose
    label: Payment reference
    description: Remittance information (Verwendungszweck); the invoice numbers paid are read here.
    data_types: [Bank statement]
    aliases: [verwendungszweck, zahlungsgrund, buchungsdetails, purpose, payment reference, remittance information,
              reference text, motif, libellé de l opération]
  - key: counterparty_name
    label: Counterparty
    description: Name of the payer or payee (Begünstigter / Zahlungspflichtiger).
    data_types: [Bank statement]
    aliases: [beguenstigter zahlungspflichtiger, begünstigter zahlungspflichtiger, begünstigter, beguenstigter,
              zahlungspflichtiger, zahlungsempfänger, auftraggeber, empfänger, name zahlungsbeteiligter,
              counterparty, payee, payer, contrepartie]
  - key: counterparty_iban
    label: Counterparty IBAN
    data_types: [Bank statement]
    aliases: [kontonummer iban, iban zahlungsbeteiligter, iban, iban kontoinhaber, counterparty iban, iban
              contrepartie]
  - key: amount
    label: Amount
    description: Signed amount of the movement (money in > 0, money out < 0).
    data_type: decimal
    group: amounts
    data_types: [Bank statement]
    aliases: [betrag, umsatz, betrag eur, amount, montant]
  - key: bank_reference
    label: Bank reference
    description: Unique reference of the movement given by the bank (CAMT AcctSvcrRef).
    data_types: [Bank statement]
    aliases: [bankreferenz, bank reference, acctsvcrref, référence banque]
  # texte libre de la source : reconnu (jamais envoyé à l'IA), jamais exporté ni lu pour décider quoi que ce
  # soit (une exonération ne se déduit jamais d'un commentaire)
  - key: remark
    label: Remark
    description: Free text of the source; never exported, never used to decide anything.
    aliases: [bemerkung, bemerkungen, notiz, kommentar, anmerkung, hinweis, remark, remarks, note, notes,
              comment, comments, remarque]

tax_rates:
  - {country: DE, since: 2021-01-01, rates: [19, 7, 0]}

# livre de caisse : texte d'une ligne d'ouverture (sans recette, dépense ni pièce) ; son solde = point de départ
opening_words: [Anfangsbestand, Anfangssaldo, Übertrag, Uebertrag, Saldovortrag, Vortrag, Kassenvortrag,
                Opening balance, Balance brought forward, Solde initial, Report à nouveau]

# livre de caisse : mots d'un paiement par CARTE dans le texte de l'écriture (Buchungstext, jamais la remarque) :
# pas de l'argent liquide, la ligne n'est pas exportée dans la caisse (signalée)
card_words: [EC-Karte, EC Karte, ec-cash, Girocard, Kartenzahlung, Kartenzahlungen, Kreditkarte, Debitkarte,
             Maestro, Mastercard, VISA, Kartenterminal, SumUp, card payment, credit card, debit card,
             paiement par carte, carte bancaire]

# relevé bancaire : mouvements HORS factures, reconnus par des mots (entiers) du motif ou de la contrepartie,
# jamais par le montant ; leur compte vient de la table des comptes bancaires de la cible (à valider)
bank_categories:
  - key: bank_fees
    label: Bank fees
    words: [Entgelt Kontoführung, Kontoführung, Kontoführungsentgelt, Kontoführungsgebühr, Entgeltabschluss,
            Rechnungsabschluss, Kontoabschluss, Bankgebühren, Bank charges, account maintenance fee, frais de tenue
            de compte]
  - key: cash_deposit
    label: Cash deposit
    words: [Bareinzahlung, Einzahlung Bargeld, Bargeldeinzahlung, cash deposit, dépôt d espèces]
  - key: vat_prepayment
    label: VAT prepayment (tax office)
    words: [USt-VZ, UStVA, Umsatzsteuervorauszahlung, Umsatzsteuer-Vorauszahlung, Umsatzsteuer Vorauszahlung,
            VAT prepayment]
  - key: rent
    label: Rent
    words: [Miete, Mietzahlung, Rent, Loyer]
    per_counterparty: true
  - key: card_settlement
    label: Card payments settlement
    words: [Kartenumsätze, Kartenumsatz, Kartenzahlungen, Kartenabrechnung, Kartenterminal, card settlement,
            card payments]
    never_booked: "card sales and their fees are not exported invoices: book this settlement with your tax
      advisor"
discount_words: [Skonto, Skontoabzug, abzgl. Skonto, cash discount, escompte]

