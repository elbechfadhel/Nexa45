postal_codes:
  DE: '^\d{5}$'
  AT: '^\d{4}$'
  CH: '^\d{4}$'
  FR: '^\d{5}$'
  IT: '^\d{5}$'
  ES: '^\d{5}$'
  NL: '^\d{4} ?[A-Z]{2}$'
  BE: '^\d{4}$'
  LU: '^\d{4}$'
  PL: '^\d{2}-\d{3}$'
  CZ: '^\d{3} ?\d{2}$'
  DK: '^\d{4}$'
  IE: '^[A-Z]\d{2}[0-9W]? ?[A-Z0-9]{4}$'   # Eircode (« D02 P820 »)
  SE: '^\d{3} ?\d{2}$'

# motifs officiels des numéros de TVA intracommunautaires (forme seulement, pas l'existence)
vat_ids:
  DE: '^DE\d{9}$'
  AT: '^ATU\d{8}$'
  FR: '^FR[0-9A-Z]{2}\d{9}$'
  IT: '^IT\d{11}$'
  ES: '^ES[0-9A-Z]\d{7}[0-9A-Z]$'
  NL: '^NL\d{9}B\d{2}$'
  BE: '^BE[01]\d{9}$'
  LU: '^LU\d{8}$'
  PL: '^PL\d{10}$'
  CZ: '^CZ\d{8,10}$'
  DK: '^DK\d{8}$'
  IE: '^IE\d[0-9A-Z+*]\d{5}[A-Z]{1,2}$'
  SE: '^SE\d{12}$'
  FI: '^FI\d{8}$'
  PT: '^PT\d{9}$'
  EL: '^EL\d{9}$'           # Grèce : préfixe EL (pays GR)
  HU: '^HU\d{8}$'
  RO: '^RO\d{2,10}$'
  BG: '^BG\d{9,10}$'
  HR: '^HR\d{11}$'
  SI: '^SI\d{8}$'
  SK: '^SK\d{10}$'
  EE: '^EE\d{9}$'
  LV: '^LV\d{11}$'
  LT: '^LT(\d{9}|\d{12})$'
  CY: '^CY\d{8}[A-Z]$'
  MT: '^MT\d{8}$'

# pays membres de l'Union européenne (2026) : un pays absent n'est jamais traité comme un pays de l'UE
