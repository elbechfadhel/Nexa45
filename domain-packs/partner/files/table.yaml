  AT: '^ATU\d{8}$'
  FR: '^FR[0-9A-Z]{2}\d{9}$'
  IT: '^IT\d{11}$'
  ES: '^ES[0-9A-Z]\d{7}[0-9A-Z]$'
  NL: '^NL\d{9}B\d{2}$'
  BE: '^BE[01]\d{9}$'
  LU: '^LU\d{8}$'
  PL: '^PL\d{10}$'
  CZ: '^CZ\d{8,10}$'
  DK: '^DK\d{8}$'
