postal_codes:
  DE: '^\d{5}$'
  AT: '^\d{4}$'
  CH: '^\d{4}$'
  FR: '^\d{5}$'
  IT: '^\d{5}$'
  ES: '^\d{5}$'
  NL: '^\d{4} ?[A-Z]{2}$'
  BE: '^\d{4}$'
  LU: '^\d{4}$'
  PL: '^\d{2}-\d{3}$'
  CZ: '^\d{3} ?\d{2}$'
  DK: '^\d{4}$'

