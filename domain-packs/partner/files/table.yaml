# Tableau de source FICHIER du domaine PARTNER : colonnes qu'un fichier de clients / fournisseurs (export
# d'un logiciel, liste tenue à la main) peut apporter, et ce qu'elles veulent dire. Aucun système ici.
#
# Les alias sont comparés après normalisation (casse, ponctuation, espaces) : « Kd-Nr. » → « kd nr »,
# « USt-IdNr. » → « ust idnr », « E-Mail » → « e mail ». Ce tableau est HORS des vocabulaires des systèmes :
# le modifier ne change aucune analyse sémantique (Odoo, Lexware…). Toute modification : incrémenter
# table_version.
#
# Listes de référence (jamais une valeur devinée) :
#   legal_forms   forme juridique en fin de nom → personne morale (le type d'adressat se déduit) ;
#   countries     noms de pays (allemand, anglais, français) et codes → ISO 3166-1 alpha-2 ;
#   postal_codes  motif du code postal par pays (un code allemand de 4 chiffres a perdu son zéro dans Excel) ;
#   vat_ids       motif du numéro de TVA intracommunautaire par pays (préfixe compris, sans espaces) ;
#   eu_members    pays membres de l'UE (ISO) : un partenaire d'un autre pays membre peut avoir une USt-IdNr,
#                 un pays hors de cette liste n'en a jamais (jamais déduit de la présence d'un motif).

table_version: "1.1.0"   # 1.1.0 : pays de l'UE explicites, 27 motifs d'USt-IdNr
domain: PARTNER
data_types: ["Customers & suppliers", "Customers", "Suppliers"]
home_country: DE

columns:
  - key: customer_number
    label: Customer number
    description: Number of the customer in the source (Kundennummer).
    aliases: [kd nr, kdnr, kd nummer, kunden nr, kundennr, kundennummer, debitor nr, debitorennummer,
              customer no, customer number, customer id, client no, client number, numéro client]
  - key: supplier_number
    label: Supplier number
    description: Number of the supplier in the source (Lieferantennummer).
    aliases: [lief nr, lieferanten nr, lieferantennummer, kreditor nr, kreditorennummer, supplier no,
              supplier number, vendor no, vendor number, numéro fournisseur]
  - key: name
    label: Name
    description: Name of the company or of the person.
    required: true
    aliases: [name, firma, firmenname, firmierung, unternehmen, kunde, kundenname, lieferant, company,
              company name, customer name, supplier name, raison sociale, nom]
  - key: contact_person
    label: Contact person
    group: contact
    aliases: [ansprechpartner, ansprechperson, kontaktperson, contact person, contact, interlocuteur]
  - key: street
    label: Street
    group: address
    aliases: [straße, strasse, str, anschrift, adresse, street, address, rue]
  - key: postal_code
    label: Postal code
    group: address
    aliases: [plz, postleitzahl, zip, zip code, postal code, postcode, code postal]
  - key: city
    label: City
    group: address
    aliases: [ort, stadt, wohnort, city, town, ville]
  - key: country
    label: Country
    group: address
    aliases: [land, staat, country, pays, länderkennzeichen]
  - key: vat_id
    label: VAT ID
    group: tax
    aliases: [ust idnr, ust id, ustid, ustidnr, ust id nr, umsatzsteuer id, vat id, vat number,
              vat no, n tva, numéro de tva]
  - key: tax_number
    label: Tax number
    group: tax
    aliases: [steuernummer, steuer nr, st nr, tax number]
  - key: email
    label: Email
    group: contact
    aliases: [e mail, email, mail, e mail adresse, email address, courriel]
  - key: phone
    label: Phone
    group: contact
    aliases: [telefon, tel, telefonnummer, phone, telephone, téléphone]
  - key: mobile
    label: Mobile
    group: contact
    aliases: [mobil, mobiltelefon, handy, mobile, portable]
  - key: fax
    label: Fax
    group: contact
    aliases: [fax, telefax]
  - key: website
    label: Website
    group: contact
    aliases: [homepage, internet, webseite, website, web, site web]
  - key: iban
    label: IBAN
    group: banking
    aliases: [iban, bankverbindung, kontonummer iban]
  - key: bic
    label: BIC
    group: banking
    aliases: [bic, swift, swift code]
  - key: bank_name
    label: Bank name
    group: banking
    aliases: [bank, kreditinstitut, bankname, bank name, banque]

