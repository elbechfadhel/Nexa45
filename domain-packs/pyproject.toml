[project]
name = "uie-domain-packs"
version = "0.1.0"
description = "UIE Domain Packs — connaissance métier par domaine et par système (YAML) + adaptateurs"
requires-python = ">=3.12"
dependencies = ["uie-core", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uie_domain_packs"]
