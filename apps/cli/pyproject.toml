[project]
name = "uie-cli"
version = "0.1.0"
description = "UIE Admin CLI — premier entrypoint du Core"
requires-python = ">=3.12"
dependencies = [
    "uie-core",
    "uie-ai",
    "uie-domain-packs",
    "uie-connectors",
    "typer>=0.12",
    "rich>=13.7",
    "uie-api",
]

[project.scripts]
uie = "uie_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uie_cli"]

[tool.uv.sources]
uie-domain-packs = { workspace = true }
uie-api = { workspace = true }
