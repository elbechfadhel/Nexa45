[project]
name = "uie-api"
version = "0.1.0"
description = "UIE Admin API — FastAPI, couche HTTP uniquement au-dessus du Core"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "uie-ai",
    "uie-connectors",
    "uie-core",
    "uie-domain-packs",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uie_api"]

[tool.uv.sources]
uie-domain-packs = { workspace = true }
uie-connectors = { workspace = true }
