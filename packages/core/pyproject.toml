[project]
name = "uie-core"
version = "0.1.0"
description = "UIE Core — System Knowledge Registry, contrats, execution (sans FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "uie-cdm",
    "pydantic>=2.9",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "polars>=1.20",
    "fastexcel>=0.12",
    "xlsxwriter>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uie_core"]
