[project]
name = "uie-cdm"
version = "0.1.0"
description = "UIE Canonical Data Model — contrat JSON Schema + runtime Pydantic"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uie_cdm"]
