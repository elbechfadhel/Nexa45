[project]
name = "uie-ai"
version = "0.1.0"
description = "UIE AI layer — SemanticEngine abstraction (rules, embeddings, LLM providers)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "openai>=3.19.2",
    "uie-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uie_ai"]
