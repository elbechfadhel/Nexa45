[project]
name = "uie-connectors"
version = "0.1.0"
description = "UIE Connectors & Schema Loaders (Odoo, DATEV, fichiers, ...)"
requires-python = ">=3.12"
dependencies = ["uie-core", "httpx>=0.27", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uie_connectors"]
