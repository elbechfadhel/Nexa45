# Systèmes CONNUS du Registry (identifiés, SANS schéma) : nom, éditeur, catégorie, description courte.
#
# Importés dans le Registry existant (table `systems`, statut `known`) par
#   uv run uie registry known-systems
# Aucun produit, aucune version, aucun champ, aucune capacité d'API : rien n'est supposé vérifié. Un système
# qui reçoit un jour un schéma publié (loader + snapshot) passe en « supported » et n'est plus modifié ici.
# Les systèmes qui ont déjà un schéma (Odoo, DATEV, Lexware Office) ne sont pas listés : ils viennent de leurs
# loaders. Descriptions = nature du logiciel seulement (jamais une version, un format ou une API supposés).

catalog_version: "1.0.0"
systems:
